name: QA Tests

# Запускается при каждом push и pull request в master
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  mock-tests:
    name: Mock Tests (pytest-mock, no backend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest pytest-mock allure-pytest requests

      - name: Run mocked API tests
        run: |
          pytest cases/001-registration-form/automation/ui/test_register_mocked.py -v

  pact-tests:
    name: Pact Contract Tests (consumer, no backend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest pact-python allure-pytest requests

      - name: Run Pact consumer contract tests
        run: |
          pytest cases/001-registration-form/automation/ui/test_register_pact.py -v

# Примечание: API-тесты (test_register_basic.py, test_register_negative.py)
# и DB-тест (test_register_db_verify.py) требуют локального Docker-стека Sortula
# (localhost:8001 + localhost:5433) — запускаются только локально.
